<header class="sticky top-0 z-30 bg-brand text-white shadow-md">
  <div class="relative mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6">
    <a routerLink="/home" aria-label="Página inicial" class="shrink-0">
      <img src="logo_fatec_br.png" alt="Logo Fatec" class="h-10 w-auto">
    </a>

    <nav
      id="menu-principal"
      aria-label="Principal"
      class="absolute inset-x-0 top-16 flex-col gap-1 bg-brand-dark px-4 py-3 shadow-lg md:static md:flex md:flex-row md:items-center md:gap-6 md:bg-transparent md:p-0 md:shadow-none"
      [class.hidden]="!menuMobileAberto()"
      [class.flex]="menuMobileAberto()"
    >
      @if (auth.isLeitor()) {
        <a routerLink="/home" (click)="fecharMenus()" class="rounded-md px-3 py-2 text-white/90 hover:bg-white/10 hover:text-white md:p-0 md:hover:bg-transparent md:hover:underline md:underline-offset-4">Início</a>
        <a routerLink="/minhas-solicitacoes" (click)="fecharMenus()" class="rounded-md px-3 py-2 text-white/90 hover:bg-white/10 hover:text-white md:p-0 md:hover:bg-transparent md:hover:underline md:underline-offset-4">Minhas solicitações</a>
      }

      @if (auth.isFuncionario()) {
        <div class="relative">
          <button
            type="button"
            (click)="toggleMenuLivros()"
            [attr.aria-expanded]="menuLivrosAberto()"
            class="flex w-full items-center justify-between gap-1 rounded-md px-3 py-2 text-white/90 hover:bg-white/10 hover:text-white md:w-auto md:p-0 md:hover:bg-transparent md:hover:underline md:underline-offset-4"
          >
            Livros
            <svg class="h-4 w-4 transition-transform" [class.rotate-180]="menuLivrosAberto()" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
            </svg>
          </button>

          @if (menuLivrosAberto()) {
            <div class="mt-1 flex flex-col rounded-md bg-white py-1 text-gray-900 shadow-lg md:absolute md:left-0 md:top-full md:mt-2 md:w-40">
              <a routerLink="/mostrar-livros" (click)="fecharMenus()" class="px-4 py-2 hover:bg-gray-100">Listar</a>
              <a routerLink="/cadastrar-livro" (click)="fecharMenus()" class="px-4 py-2 hover:bg-gray-100">Cadastrar</a>
            </div>
          }
        </div>

        <div class="relative">
          <button
            type="button"
            (click)="toggleMenuNavUsuario()"
            [attr.aria-expanded]="menuNavUsuarioAberto()"
            class="flex w-full items-center justify-between gap-1 rounded-md px-3 py-2 text-white/90 hover:bg-white/10 hover:text-white md:w-auto md:p-0 md:hover:bg-transparent md:hover:underline md:underline-offset-4"
          >
            Usuário
            <svg class="h-4 w-4 transition-transform" [class.rotate-180]="menuNavUsuarioAberto()" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
            </svg>
          </button>

          @if (menuNavUsuarioAberto()) {
            <div class="mt-1 flex flex-col rounded-md bg-white py-1 text-gray-900 shadow-lg md:absolute md:left-0 md:top-full md:mt-2 md:w-40">
              <a routerLink="/usuarios" (click)="fecharMenus()" class="px-4 py-2 hover:bg-gray-100">Listar</a>
              <a routerLink="/usuarios/cadastro" (click)="fecharMenus()" class="px-4 py-2 hover:bg-gray-100">Cadastrar</a>
            </div>
          }
        </div>

        <a routerLink="/solicitacoes" (click)="fecharMenus()" class="rounded-md px-3 py-2 text-white/90 hover:bg-white/10 hover:text-white md:p-0 md:hover:bg-transparent md:hover:underline md:underline-offset-4">Solicitações</a>

        <a href="#" class="rounded-md px-3 py-2 text-white/90 hover:bg-white/10 hover:text-white md:p-0 md:hover:bg-transparent md:hover:underline md:underline-offset-4">Relatórios</a>
      }
    </nav>

    <div class="flex items-center gap-2">
      <div class="relative">
        <button
          type="button"
          (click)="toggleMenuUsuario()"
          aria-label="Menu do usuário"
          [attr.aria-expanded]="menuUsuarioAberto()"
          class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-white/15 hover:bg-white/25"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </button>

        @if (menuUsuarioAberto()) {
          <div class="absolute right-0 top-full z-40 mt-2 w-56 overflow-hidden rounded-md bg-white py-1 text-gray-900 shadow-lg">
            <p class="truncate border-b border-gray-100 px-4 py-2 text-xs text-gray-500">{{ auth.getEmail() }}</p>
            <a routerLink="/meus-dados" (click)="fecharMenus()" class="block px-4 py-2 text-sm hover:bg-gray-100">Meus dados</a>
            <button type="button" (click)="sair()" class="block w-full px-4 py-2 text-left text-sm font-medium text-red-600 hover:bg-red-50">Sair</button>
          </div>
        }
      </div>

      <button
        type="button"
        (click)="toggleMenuMobile()"
        aria-controls="menu-principal"
        [attr.aria-expanded]="menuMobileAberto()"
        [attr.aria-label]="menuMobileAberto() ? 'Fechar menu' : 'Abrir menu'"
        class="inline-flex h-10 w-10 items-center justify-center rounded-md hover:bg-white/10 md:hidden"
      >
        @if (menuMobileAberto()) {
          <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
          </svg>
        } @else {
          <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>
