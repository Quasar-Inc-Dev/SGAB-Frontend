<app-header></app-header>

<section class="mx-auto mt-6 w-full max-w-3xl flex-1 px-4 sm:px-6">
    <div class="mb-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-gray-900">Meus dados</h1>
        <a routerLink="/home" class="text-sm font-medium text-brand hover:underline">Voltar</a>
    </div>

    @if (carregando()) {
        <p class="py-12 text-center text-gray-500">Carregando seus dados...</p>
    } @else if (erro() || !usuario()) {
        <p class="py-12 text-center text-red-600">Não foi possível carregar seus dados.</p>
    } @else {
        <div class="rounded-xl bg-white p-6 shadow-md">
            <div class="mb-6 flex items-center gap-4">
                <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full bg-brand-dark/10 text-2xl font-bold text-brand-dark">
                    {{ usuario()!.nome.charAt(0) }}
                </div>
                <div class="min-w-0">
                    <p class="truncate text-lg font-semibold text-gray-900">{{ usuario()!.nome }}</p>
                    <p class="truncate text-sm text-gray-500">{{ usuario()!.email }}</p>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                @for (campo of campos; track campo.key) {
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium text-gray-700">{{ campo.label }}</label>
                        <input readonly [value]="valor(campo.key)" class="rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-gray-800">
                    </div>
                }
            </div>
        </div>
    }
</section>

<app-footer></app-footer>
