<section class="px-4">
    <div class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-2xl">
        <div class="mb-6 text-center">
            <h1 class="text-3xl font-bold tracking-wide text-brand-dark">SGAB</h1>
            <p class="mt-1 text-sm text-gray-500">Acesse sua conta para continuar</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>
            <div class="flex flex-col gap-1">
                <label for="email" class="text-sm font-medium text-gray-700">E-mail</label>
                <input
                    id="email"
                    type="email"
                    formControlName="email"
                    autocomplete="email"
                    placeholder="seu@email.com"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
                    [class.border-red-500]="form.controls.email.touched && form.controls.email.invalid"
                >
                @if (form.controls.email.touched && form.controls.email.invalid) {
                    <p class="text-xs text-red-600">Informe um e-mail válido.</p>
                }
            </div>

            <div class="flex flex-col gap-1">
                <label for="password" class="text-sm font-medium text-gray-700">Senha</label>
                <div class="relative">
                    <input
                        id="password"
                        formControlName="senha"
                        autocomplete="current-password"
                        placeholder="Sua senha"
                        [type]="senhaVisivel() ? 'text' : 'password'"
                        class="w-full rounded-lg border border-gray-300 px-3 py-2.5 pr-10 text-sm outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
                    >
                    <button
                        type="button"
                        (click)="toggleSenhaVisivel()"
                        [attr.aria-label]="senhaVisivel() ? 'Ocultar senha' : 'Mostrar senha'"
                        class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-800"
                    >
                        @if (senhaVisivel()) {
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.1A9.7 9.7 0 0112 5c4.5 0 8.3 2.9 9.5 7a10 10 0 01-2.2 3.6M6.6 6.6A10 10 0 002.5 12c1.2 4.1 5 7 9.5 7a9.7 9.7 0 004.4-1" />
                            </svg>
                        } @else {
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z" />
                                <circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        }
                    </button>
                </div>
                <a href="#" class="self-end text-xs font-medium text-brand hover:underline">Esqueci a senha</a>
            </div>

            @if (erroLogin()) {
                <p role="alert" class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
                    {{ erroLogin() }}
                </p>
            }

            <button
                type="submit"
                [disabled]="enviando()"
                class="rounded-lg bg-brand py-2.5 font-semibold text-white transition-colors hover:bg-brand-dark disabled:cursor-not-allowed disabled:opacity-60"
            >
                {{ enviando() ? 'Entrando...' : 'Entrar' }}
            </button>

            <p class="text-center text-sm text-gray-600">
                Não tem conta?
                <a href="#" class="font-semibold text-brand hover:underline">Cadastrar-se</a>
            </p>
        </form>
    </div>

    <img src="logo_fatec_br.png" alt="Logo Fatec" class="absolute bottom-6 left-1/2 w-24 -translate-x-1/2 opacity-90">
</section>
