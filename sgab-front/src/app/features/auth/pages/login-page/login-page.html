<section>
    <div>
        <h1>Login</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div>
            <label for="email">Email: </label>
            <input formControlName="email" type="email" id="email">
        </div>

        <div>
            <label for="password">Senha: </label>
            <input formControlName="senha" type="password" id="password">
        </div>

        <div>
            <button type="submit" style="background-color: red; padding: 15px 15px 15px 15px;">Logar</button>
        </div>
    </form>
</section>
