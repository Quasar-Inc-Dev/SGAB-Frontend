<app-header></app-header>

<section class="mx-auto mt-6 w-full max-w-5xl flex-1 px-4 sm:px-6">
    <div class="mb-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-gray-900">Detalhes do livro</h1>
        <a routerLink="/home" class="text-sm font-medium text-brand hover:underline">Voltar</a>
    </div>

    @if (carregando()) {
        <p class="py-12 text-center text-gray-500">Carregando livro...</p>
    } @else if (erro() || !livro()) {
        <p class="py-12 text-center text-red-600">Livro não encontrado.</p>
    } @else {
        <div class="grid grid-cols-1 gap-6 rounded-xl bg-white p-6 shadow-md md:grid-cols-[220px_1fr]">
            <div class="flex flex-col items-center">
                @if (livro()!.imgUrl) {
                    <img [src]="livro()!.imgUrl" [alt]="'Capa de ' + livro()!.titulo" class="aspect-[3/4] w-full rounded-lg object-cover shadow">
                } @else {
                    <div class="flex aspect-[3/4] w-full items-center justify-center rounded-lg bg-brand-dark/10 text-5xl font-bold text-brand-dark">
                        {{ livro()!.titulo.charAt(0) }}
                    </div>
                }
            </div>

            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                @for (campo of campos; track campo.key) {
                    <div class="flex flex-col gap-1" [class.sm:col-span-2]="campo.span">
                        <label class="text-sm font-medium text-gray-700">{{ campo.label }}</label>
                        @if (campo.textarea) {
                            <textarea readonly rows="4" [value]="valor(campo.key)" class="resize-none rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-gray-800"></textarea>
                        } @else {
                            <input readonly [value]="valor(campo.key)" class="rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-gray-800">
                        }
                    </div>
                }
            </div>
        </div>
    }
</section>

<app-footer></app-footer>
